<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="800" fill="#E7EDF9"/>
  <rect y="600" width="1200" height="200" fill="#C7D2E8"/>
  <!-- court -->
  <rect x="90" y="250" width="1020" height="430" fill="#1E3A8A"/>
  <rect x="110" y="270" width="980" height="390" fill="#2C4EA3"/>
  <g stroke="#ffffff" stroke-width="6" fill="none">
    <line x1="600" y1="270" x2="600" y2="660"/>
    <rect x="110" y="270" width="980" height="390"/>
    <path d="M110 380 C 300 380 300 560 110 560"/>
    <path d="M1090 380 C 900 380 900 560 1090 560"/>
  </g>
  <!-- hoop left -->
  <g>
    <rect x="52" y="330" width="16" height="180" fill="#ffffff"/>
    <rect x="30" y="352" width="26" height="80" rx="6" fill="#ffffff"/>
    <circle cx="72" cy="392" r="26" fill="none" stroke="#DC2626" stroke-width="8"/>
  </g>
  <!-- hoop right -->
  <g>
    <rect x="1132" y="330" width="16" height="180" fill="#ffffff"/>
    <rect x="1144" y="352" width="26" height="80" rx="6" fill="#ffffff"/>
    <circle cx="1128" cy="392" r="26" fill="none" stroke="#DC2626" stroke-width="8"/>
  </g>
  <!-- ball -->
  <circle cx="600" cy="470" r="42" fill="#DC2626"/>
  <path d="M600 428 V512 M558 470 H642 M568 440 C 600 470 632 500 632 500" stroke="#7F1D1D" stroke-width="5" fill="none"/>
  <!-- scoreboard -->
  <rect x="420" y="60" width="360" height="120" rx="16" fill="#0F1E4C"/>
  <text x="510" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#FDE68A">24</text>
  <text x="600" y="120" text-anchor="middle" font-family="Arial" font-size="30" fill="#ffffff">:</text>
  <text x="690" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="#FDE68A">31</text>
</svg>
