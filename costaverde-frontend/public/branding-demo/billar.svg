  <text x="600" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#FFC94A" letter-spacing="8">BILLAR</text>
  <!-- table -->
  <g transform="translate(600,470)">
    <rect x="-380" y="-130" width="760" height="260" rx="34" fill="#0F5C31" stroke="#7C2D12" stroke-width="22"/>
    <circle cx="-330" cy="-85" r="26" fill="#070B08"/>
    <circle cx="330" cy="-85" r="26" fill="#070B08"/>
    <circle cx="-330" cy="85" r="26" fill="#070B08"/>
    <circle cx="330" cy="85" r="26" fill="#070B08"/>
    <circle cx="0" cy="-110" r="22" fill="#070B08"/>
