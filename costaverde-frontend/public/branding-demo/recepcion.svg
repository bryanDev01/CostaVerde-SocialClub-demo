<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="800" fill="#0D1410"/>
  <!-- back wall with arch windows -->
  <rect x="0" y="0" width="1200" height="560" fill="#101812"/>
  <g>
    <path d="M120 520 V300 a90 90 0 0 1 180 0 v220 Z" fill="#2A4A35" stroke="#159957" stroke-width="10"/>
    <path d="M510 520 V300 a90 90 0 0 1 180 0 v220 Z" fill="#2A4A35" stroke="#159957" stroke-width="10"/>
    <path d="M900 520 V300 a90 90 0 0 1 180 0 v220 Z" fill="#2A4A35" stroke="#159957" stroke-width="10"/>
    <line x1="210" y1="215" x2="210" y2="520" stroke="#159957" stroke-width="8"/>
    <line x1="600" y1="215" x2="600" y2="520" stroke="#159957" stroke-width="8"/>
    <line x1="990" y1="215" x2="990" y2="520" stroke="#159957" stroke-width="8"/>
  </g>
  <!-- ceiling fan -->
  <g transform="translate(360,120)" stroke="#159957" stroke-width="10" fill="#159957">
    <line x1="0" y1="-120" x2="0" y2="-14"/>
    <ellipse cx="0" cy="0" rx="16" ry="16"/>
    <path d="M-14 -6 L-120 -26 L-120 -8 L-14 6 Z"/>
    <path d="M14 -6 L120 -26 L120 -8 L14 6 Z"/>
  </g>
  <!-- terrazzo floor -->
  <rect x="0" y="560" width="1200" height="240" fill="#E4DCC8"/>
  <g fill="#159957" opacity="0.35">
    <circle cx="140" cy="640" r="7"/><circle cx="420" cy="700" r="6"/><circle cx="760" cy="620" r="7"/><circle cx="1040" cy="720" r="6"/><circle cx="300" cy="760" r="5"/><circle cx="900" cy="770" r="5"/>
  </g>
  <g fill="#FFC94A" opacity="0.3">
    <circle cx="240" cy="680" r="6"/><circle cx="620" cy="740" r="6"/><circle cx="980" cy="640" r="6"/>
  </g>
  <!-- reception desk -->
  <rect x="330" y="430" width="540" height="60" rx="10" fill="#8B5E34"/>
  <rect x="350" y="490" width="500" height="180" fill="#159957"/>
  <rect x="350" y="540" width="500" height="18" fill="#FFC94A"/>
  <text x="600" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#ffffff" letter-spacing="6">RECEPCIÓN</text>
  <!-- plants -->
  <g>
    <path d="M150 700 h90 l-14 -90 h-62 Z" fill="#FFC94A"/>
    <g stroke="#159957" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M195 610 C 170 550 176 510 198 470"/>
      <path d="M195 610 C 156 570 140 540 136 500"/>
      <path d="M195 610 C 234 570 250 540 254 500"/>
    </g>
    <path d="M830 700 h90 l-14 -90 h-62 Z" fill="#FFC94A"/>
    <g stroke="#159957" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M875 610 C 850 550 856 510 878 470"/>
      <path d="M875 610 C 836 570 820 540 816 500"/>
      <path d="M875 610 C 914 570 930 540 934 500"/>
    </g>
  </g>
</svg>
